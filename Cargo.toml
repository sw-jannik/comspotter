[package]
name = "comspotter"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
trackaudio = "0.3.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
eframe = "0.37.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
winresource = "0.1.34"
