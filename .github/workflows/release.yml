name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "comspotter-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/comspotter.exe $name/
          if (Test-Path README.md) { Copy-Item README.md $name/ }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          Copy-Item target/release/comspotter.exe "$name.exe"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            comspotter-${{ github.ref_name }}-windows-x86_64.zip
            comspotter-${{ github.ref_name }}-windows-x86_64.exe
